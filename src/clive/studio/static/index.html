  // artifact fields
  const fields = ph.artifact_fields || (ph.artifact_fields = []);
  const fieldList = el("div");
  if (!fields.length) fieldList.append(el("p", { className: "empty", textContent: "No fields — the student would submit nothing." }));

  fields.forEach((f, i) => {
    const head = el("div", { className: "head" }, [el("div", { className: "grip", textContent: `#${i + 1}` })]);
    head.append(...reorderControls(fields, i, () => { markDirty("prompt"); render(); }));
    const del = el("button", { className: "mini", textContent: "Remove" });
    del.onclick = () => { fields.splice(i, 1); markDirty("prompt"); render(); };
    head.append(el("div", { style: "flex:1" }), del);

    fieldList.append(el("div", { className: "item" }, [
      head,
      el("div", { className: "row" }, [
        field("id", textInput(f.id, (v) => { f.id = v; markDirty("prompt"); }, { mono: true })),
        field("label", textInput(f.label, (v) => { f.label = v; markDirty("prompt"); })),
        field("rows", textInput(f.rows || 4, (v) => { f.rows = Number(v); markDirty("prompt"); }, { type: "number" })),
      ]),
      field("hint (shown under the box in Run)", textInput(f.hint || "", (v) => { f.hint = v; markDirty("prompt"); })),
    ]));
  });

  const addField = el("button", { className: "act ghost", textContent: "+ Add artifact field" });
  addField.onclick = () => { fields.push({ id: "", label: "", hint: "", rows: 4 }); markDirty("prompt"); render(); };

  out.append(el("div", { className: "card" }, [
    el("h3", { textContent: "Artifact fields" }),
    el("p", {
      className: "sub",
      textContent: "What the student submits for this phase. Each one becomes a box in Run and a labelled block "
        + "in the template's artifact loop — add a field here and it appears in the prompt without a template edit.",
    }),
    fieldList, addField,
  ]));

  out.append(el("div", { className: "card" }, [
    el("h3", { textContent: "System prompt" }),
    el("p", { className: "sub", textContent: "The judging contract. Applies to every criterion in this phase." }),
    textArea(ph.system_prompt, (v) => { ph.system_prompt = v; markDirty("prompt"); }, 16, true),
  ]));

  const vars = el("p", { className: "sub" });
  vars.append("Available: ");
  for (const v of ["problem", "artifact", "artifact_fields", "criteria_to_judge", "attempt"]) {
    vars.append(el("span", { className: "tag", textContent: v }), " ");
  }

  const previewBtn = el("button", { className: "act ghost", textContent: "Preview rendered prompt" });
  previewBtn.onclick = doPreview;

  const card = el("div", { className: "card" }, [
    el("h3", { textContent: "User template (Jinja)" }),
    vars,
    textArea(ph.user_template, (v) => { ph.user_template = v; markDirty("prompt"); }, 20, true),
    el("div", { style: "margin-top:10px" }, previewBtn),
  ]);
  if (S.preview) {
    card.append(el("h3", { textContent: "Rendered", style: "margin-top:14px" }));
    card.append(el("p", { className: "sub", textContent: `Against ${S.problemSlug}, using the Run tab's current draft artifact.` }));
    card.append(el("pre", { className: "preview", textContent: S.preview }));
  }
  out.append(card);

  return out;
}

function modelOptions(current) {
  const list = S.boot.models.slice();
  if (current && !list.includes(current)) list.unshift(current);
  return list;
}

async function doPreview() {
  try {
    const d = await api("POST", "/api/preview", judgeContext({
      phase: S.phase,
      criteria: S.criteria.criteria,
      artifact: S.mode === "sandbox" ? sess().artifact : artifactFromDraft(),
      attempt: S.mode === "sandbox" ? sess().attempt : readDraft().__attempt || 1,
      prior_artifacts: priorArtifacts(),
    }));
    S.preview = d.user_prompt;
    say("Rendered against the unsaved editor state.", "ok");
    render();
  } catch (e) { say(e.message, "err"); }
}

async function savePhase() {
  if (savedToSandbox("prompt", "Prompt")) return;
  try {
    const d = await api("PUT", `/api/phase/${S.phaseId}`, S.phase);
    S.phase = d.phase;
    S.dirty.prompt = false;
    S.boot = { ...S.boot, phases: (await api("GET", "/api/bootstrap")).phases };
    // A renamed label regroups the Rubric tab, so refresh alongside the phase list.
    await loadRubric();
    say(`Saved prompts/phases/${S.phaseId}.yaml`, "ok");
    render();
  } catch (e) { say(e.message, "err"); }
}

// ------------------------------------------------------------------------ run

function renderRun() {
  const out = el("div");
  const draft = readDraft();

  const picker = problemPicker(async (slug) => {
    if (!confirmLeave()) { render(); return; }
    if (anyDirty()) await reloadAll();
    await loadProblem(slug);
    S.result = null;
    render();
  });

  out.append(el("div", { className: "card" }, [
    el("h3", { textContent: `Run — ${S.phase.label}` }),
    el("p", {
      className: "sub",
      textContent: `Judges one submission against all ${S.criteria.criteria.length} saved criteria in a single call, `
        + `using ${S.phase.model.id} at effort ${S.phase.model.effort}. Saved criteria and prompt are used — save edits first.`,
    }),
    el("div", { className: "row" }, [
      field("Problem", picker),
      field("Attempt", textInput(draft.__attempt || 1, (v) => {
        const d = readDraft(); d.__attempt = Number(v) || 1; writeDraft(d);
      }, { type: "number" }), "Passed to the template as {{ attempt }}."),
    ]),
  ]));

  const form = el("div", { className: "card" }, [el("h3", { textContent: "Student artifact" })]);
  const fields = S.phase.artifact_fields || [];
  if (!fields.length) form.append(el("p", { className: "empty", textContent: "This phase has no artifact fields. Add some in the Prompt tab." }));
  for (const f of fields) {
    form.append(field(
      f.label || f.id,
      textArea(draft[f.id] || "", (v) => { const d = readDraft(); d[f.id] = v; writeDraft(d); }, f.rows || 4),
      f.hint,
    ));
  }
  const clear = el("button", { className: "mini", textContent: "Clear this draft" });
  clear.onclick = () => { localStorage.removeItem(draftKey()); render(); };
  form.append(el("div", { style: "margin-top:8px" }, clear));
  out.append(form);

  if (S.result) out.append(renderResult(S.result));
  return out;
}

function renderResult(r) {
  const card = el("div", { className: "card" }, [el("h3", { textContent: "Verdicts" })]);
  card.append(el("p", {
    className: "sub",
    textContent: `${r.model} · ${r.usage.input_tokens} in / ${r.usage.output_tokens} out`,
  }));

  if (r.missing_ids.length) {
    card.append(el("div", { className: "note warn", textContent: `Judge returned no verdict for: ${r.missing_ids.join(", ")}` }));
  }
  if (r.unexpected_ids.length) {
    card.append(el("div", { className: "note warn", textContent: `Judge invented criterion ids: ${r.unexpected_ids.join(", ")}` }));
  }

  const byId = Object.fromEntries((S.criteria.criteria || []).map((c) => [c.id, c]));
  for (const v of r.verdicts) {
    const cid = el("div", { className: "cid", textContent: v.criterion_id });
    const advisory = isAdvisory(byId[v.criterion_id]);
    if (advisory) cid.append(el("span", { className: "gate", textContent: "advisory" }));
    const body = el("div", { className: "body" }, [
      cid,
      el("div", { className: "meta", textContent: `confidence: ${v.confidence}`
        + (advisory && v.verdict === "FAIL" ? " · does not block advancement" : "") }),
    ]);
    if (v.evidence) {
      body.append(el("blockquote", { textContent: v.evidence }));
      if (!v.evidence_found) {
        body.append(el("div", { className: "note warn", style: "margin-top:8px", textContent:
          "This quote does not appear in the artifact — the judge asserted rather than observed." }));
      }
    } else {
      body.append(el("div", { className: "meta", textContent: "no evidence quoted" }));
    }
    // Coaching seam: the judge does not return this field yet. When tutoring text is
    // added to prompts/base/output_schema.json and the phase system prompts, it will
    // render here for both the Run tab and a Sandbox session with no further change.
    if (v.coaching) body.append(el("div", { className: "note", textContent: v.coaching }));
    card.append(el("div", { className: "verdict" }, [
      el("div", { className: `badge ${v.verdict}`, textContent: v.verdict }), body,
    ]));
  }
  return card;
}

async function runJudge() {
  const attempt = readDraft().__attempt || 1;
  const artifact = artifactFromDraft();

  S.running = true; S.result = null; renderBar();
  say("Judging…");
  try {
    S.result = await api("POST", "/api/judge", judgeContext({ artifact, attempt }));
    // Until now a Run result died with the next tab switch. Recording it is what
    // gives the Rubric tab anything to show outside a sandbox session.
    recordStatus(S.result.verdicts, S.criteria.criteria, attempt);
    const failed = S.result.verdicts.filter((v) => v.verdict === "FAIL").length;
    say(`${S.result.verdicts.length - failed} pass, ${failed} fail.`, "ok");
  } catch (e) {
    say(e.message, "err");
  } finally {
    S.running = false;
    render();
  }
}

// --------------------------------------------------------------------- rubric

const STATE_LABEL = { PASS: "PASS", FAIL: "FAIL", stale: "STALE", unjudged: "—" };

// Mirrors GATES in prompts.py. A criterion with no gate blocks, matching DEFAULT_GATE
// there: content written before the field existed was written as a requirement.
const GATES = ["gating", "advisory"];
const isAdvisory = (criterion) => (criterion || {}).gate === "advisory";

function renderRubric() {
  const out = el("div");
  const groups = allRubrics();
  const bucket = statusBucket();
  const t = tally(groups, bucket);

  out.append(el("div", { className: "card" }, [
    el("h3", { textContent: "Every criterion, every phase" }),
    el("p", {
      className: "sub",
      textContent: `${t.total} criteria across ${groups.length} phases, judged against `
        + `${S.problem ? S.problem.title : S.problemSlug}. Statuses shown are the `
        + `${S.mode === "sandbox" ? "sandbox" : "real-file"} ones; the two are kept apart, `
        + "so a sandbox experiment never reads as the saved rubric's status.",
    }),
    el("div", { className: "row" }, [
      el("div", { className: "f" }, summaryLine(t)),
    ]),
  ]));

  if (!t.total) {
    out.append(el("div", { className: "card" }, [
      el("p", { className: "empty", textContent: "No criteria defined in any phase yet." }),
    ]));
    return out;
  }

  for (const g of groups) {
    const card = el("div", { className: "card" });
    const gt = tally([g], bucket);
    const head = el("div", { className: "rub-head" }, [
      el("h3", { textContent: g.label }),
      el("span", { className: "tag", textContent: `rubric v${g.criteria_version}` }),
      el("span", {
        className: "count",
        textContent: `${gt.PASS}/${gt.total} passing`
          + (gt.stale ? ` · ${gt.stale} stale` : "")
          + (gt.unjudged ? ` · ${gt.unjudged} not judged` : ""),
      }),
    ]);
    card.append(head);

    if (!g.criteria.length) {
      card.append(el("p", { className: "empty", textContent: "No criteria in this phase." }));
    }
    for (const c of g.criteria) {
      card.append(rubricRow(g, c, statusOf(bucket, g.phase, c)));
    }

    const edit = el("button", { className: "mini", textContent: `Edit ${g.label} criteria` });
    edit.onclick = async () => {
      if (!confirmLeave()) return;
      if (anyDirty()) await reloadAll();
      await loadPhase(g.phase);
      S.tab = "criteria";
      render();
    };
    card.append(el("div", { style: "margin-top:10px" }, edit));
    out.append(card);
  }
  return out;
}

function summaryLine(t) {
  const bits = [
    `${t.PASS} passing`,
    `${t.FAIL} failing`,
    t.stale ? `${t.stale} stale` : null,
    `${t.unjudged} not yet judged`,
  ].filter(Boolean);
  return el("div", { textContent: bits.join("  ·  ") });
}

function rubricRow(group, criterion, st) {
  const head = el("div", { className: "cid", textContent: criterion.id });
  if (isAdvisory(criterion)) head.append(el("span", { className: "gate", textContent: "advisory" }));
  const body = el("div", { className: "body" }, [
    el("div", { textContent: criterion.text || "(no text)" }),
    head,
  ]);
  if (isAdvisory(criterion) && st.state === "FAIL") {
    body.append(el("div", { className: "meta", style: "margin-top:4px", textContent:
      "Not met — reported to the student, but it did not hold them in the phase." }));
  }

  if (st.state === "stale") {
    body.append(el("div", { className: "note warn", style: "margin-top:6px", textContent:
      `Last judged ${st.verdict}, but this criterion has been reworded since — `
      + "the verdict is for text the judge never saw. Re-run to refresh it." }));
  }

  const detail = el("details");
  detail.append(el("summary", { textContent: "guidance" + (st.evidence ? " and evidence" : "") }));
  if (criterion.guidance) {
    detail.append(el("div", { className: "guide", textContent: criterion.guidance.trim() }));
  }
  if (st.evidence) {
    detail.append(el("blockquote", { textContent: st.evidence }));
    if (st.evidence_found === false) {
      detail.append(el("div", { className: "note warn", style: "margin-top:6px", textContent:
        "This quote was not found in the artifact — the judge asserted rather than observed." }));
    }
  } else if (st.state === "PASS" || st.state === "FAIL") {
    detail.append(el("div", { className: "meta", textContent: "no evidence quoted" }));
  }
  body.append(detail);

  const badge = el("div", {
    className: `badge ${st.state}`,
    textContent: STATE_LABEL[st.state],
  });
  if (st.state === "stale") badge.title = `was ${st.verdict}`;
  if (st.confidence) badge.title = `${badge.title || st.verdict} · confidence ${st.confidence}`;

  return el("div", { className: "rub-row" }, [badge, body]);
}

// -------------------------------------------------------------------- session

const phaseIndex = (id) => S.boot.phases.findIndex((p) => p.phase === id);
const nextPhase = () => S.boot.phases[phaseIndex(S.phaseId) + 1] || null;

function renderSession() {
  const out = el("div");
  const st = sess();

  // Progress track: passed / current / unlocked / locked.
  const track = el("div", { className: "track" });
  S.boot.phases.forEach((p) => {
    const ps = sess(p.phase);
    const cls = ps.passed ? "passed" : p.phase === S.phaseId ? "current" : ps.unlocked ? "" : "locked";
    const step = el("div", { className: `step ${cls}` }, [
      el("b", { textContent: p.label }),
      el("span", {
        textContent: ps.passed ? "passed" : ps.unlocked ? `attempt ${ps.attempt}` : "locked",
      }),
    ]);
    if (ps.unlocked && p.phase !== S.phaseId) {
      step.style = "cursor:pointer";
      step.onclick = async () => { await loadPhase(p.phase); render(); };
    }
    track.append(step);
  });
  out.append(track);

  // Session controls.
  const picker = problemPicker(async (slug) => {
    S.sandbox.session = freshSession(slug);
    writeSandbox();
    await loadProblem(slug);
    await loadPhase(S.boot.phases[0].phase);
    S.result = null;
    say("New problem — session restarted.", "ok");
    render();
  });

  const carry = el("input", { type: "checkbox", checked: S.sandbox.settings.carryForward });
  carry.style = "width:auto";
  carry.onchange = () => {
    S.sandbox.settings.carryForward = carry.checked;
    writeSandbox();
    render();
  };

  const controls = el("div", { className: "row" }, [
    field("Problem", picker, "Changing it restarts the session."),
    field("Carry earlier phases into the prompt",
      el("div", {}, [carry, el("span", { textContent: " show this student's earlier work to the judge" })]),
      "Off by default; with it off the prompt is identical to the Run tab's."),
  ]);

  const nxt = nextPhase();
  const buttons = el("div", { className: "row", style: "margin-top:10px" });
  if (nxt && !sess(nxt.phase).unlocked) {
    const skip = el("button", { className: "mini", textContent: `Skip ahead — unlock ${nxt.label}` });
    skip.onclick = () => {
      sess(nxt.phase).unlocked = true;
      writeSandbox();
      say(`${nxt.label} unlocked without passing ${S.phase.label}.`, "ok");
      render();
    };
    buttons.append(skip);
  }
  const restart = el("button", { className: "mini", textContent: "Restart session" });
  restart.onclick = async () => {
    if (!confirm("Clear every artifact, attempt count, and transcript in this session?")) return;
    S.sandbox.session = freshSession(S.problemSlug);
    writeSandbox();
    await loadPhase(S.boot.phases[0].phase);
    S.result = null;
    render();
  };
  buttons.append(restart);
  controls.append(buttons);

  out.append(el("div", { className: "card" }, [
    el("h3", { textContent: "Student session" }),
    el("p", {
      className: "sub",
      textContent: "You are the student. Submissions are judged against the sandbox copy of the "
        + "criteria and prompt, so any edit you made in the other tabs is already in play.",
    }),
    controls,
  ]));

  if (!st.unlocked) {
    out.append(el("div", { className: "card" }, [
      el("div", { className: "note warn", textContent:
        `${S.phase.label} is locked. Pass the phases before it, or use "Skip ahead" from one of them.` }),
    ]));
    return out;
  }

  // The phase's own instructions, then the artifact form.
  const form = el("div", { className: "card" }, [
    el("h3", { textContent: `${S.phase.label} — attempt ${st.attempt}` }),
  ]);
  if (S.phase.task_description) {
    form.append(el("div", { className: "task", textContent: S.phase.task_description.trim() }));
  } else {
    form.append(el("div", { className: "note warn", textContent:
      "This phase has no task_description. Add one in the Prompt tab so the student knows what to do." }));
  }
  if (st.passed) {
    form.append(el("div", { className: "note", style: "background:var(--pass-bg);color:var(--pass)",
      textContent: "Already passed. You can still resubmit to see what a different answer scores." }));
  }

  const fields = S.phase.artifact_fields || [];
  if (!fields.length) form.append(el("p", { className: "empty", textContent: "This phase has no artifact fields." }));
  for (const f of fields) {
    form.append(field(
      f.label || f.id,
      textArea(st.artifact[f.id] || "", (v) => { st.artifact[f.id] = v; writeSandbox(); }, f.rows || 4),
      f.hint,
    ));
  }
  out.append(form);

  if (st.hint) out.append(renderHint(st.hint));
  if (st.nudge) out.append(renderNudge(st.nudge));
  else if (S.nudging) {
    out.append(el("div", { className: "card nudge-card" }, [
      el("h3", { textContent: "What is holding you here" }),
      el("p", { className: "empty", textContent: "Working out where to start…" }),
    ]));
  }
  if (S.result) out.append(renderResult(S.result));
  if (st.transcript.length > 1 || (st.transcript.length === 1 && !S.result)) {
    out.append(renderTranscript(st));
  }
  return out;
}

function renderTranscript(st) {
  const card = el("div", { className: "card" }, [
    el("h3", { textContent: "Earlier attempts" }),
    el("p", { className: "sub", textContent: "What was submitted each time, and how it scored." }),
  ]);
  for (const a of st.transcript.slice().reverse()) {
    const line = a.verdicts.map((v) => `${v.criterion_id} ${v.verdict}`).join(" · ");
    card.append(el("div", { className: "item" }, [
      el("div", { className: "attempt-row" }, [
        el("span", { className: "n", textContent: `attempt ${a.attempt}` }),
        el("span", { textContent: line }),
      ]),
    ]));
  }
  return card;
}

function renderHint(h) {
  const card = el("div", { className: "card hint-card" }, [
    el("h3", { textContent: "Hint" }),
    el("div", { className: "diagnosis", textContent: h.diagnosis }),
    el("div", { className: "body", textContent: h.hint }),
  ]);

  // Naming the criterion, and saying it is not the blocker, is the honest version:
  // the student is being pointed at depth, not told why they failed.
  card.append(el("div", { className: "points-at" }, [
    el("span", { textContent: "Points at " }),
    el("span", { className: "cid", textContent: h.criterion_id }),
    el("span", { className: "gate", textContent: "advisory" }),
    el("div", { style: "margin-top:4px", textContent:
      `${h.criterion_text} — optional depth, not what is holding you here.` }),
  ]));

  const dismiss = el("button", { className: "mini", textContent: "Dismiss" });
  dismiss.onclick = () => { sess().hint = null; writeSandbox(); render(); };
  card.append(el("div", { style: "margin-top:10px" }, [dismiss]));
  return card;
}

function renderNudge(n) {
  const card = el("div", { className: "card nudge-card" }, [
    el("h3", { textContent: "What is holding you here" }),
    el("div", { className: "summary", textContent: n.summary }),
  ]);

  // Every failing gate, listed from the server's own set rather than from the summary
  // prose. A model that forgets to mention one still cannot hide it from the student.
  const list = el("ul", { className: "outstanding" });
  for (const f of n.failing) {
    const focus = f.id === n.focus_id;
    const head = el("span", { className: "cid", textContent: f.id });
    if (focus) head.append(el("span", { className: "start-here", textContent: "start here" }));
    list.append(el("li", { className: focus ? "focus" : "" }, [
      head, el("div", { textContent: f.text }),
    ]));
  }
  card.append(list);

  card.append(el("div", { className: "body", textContent: n.nudge }));
  card.append(el("div", { className: "reason", textContent: `Why this one first: ${n.reason}` }));

  const dismiss = el("button", { className: "mini", textContent: "Dismiss" });
  dismiss.onclick = () => { sess().nudge = null; writeSandbox(); render(); };
  card.append(el("div", { style: "margin-top:10px" }, [dismiss]));
  return card;
}

/** Fetch the nudge for a submission that just failed its gates.
 *
 * Pushed, not asked for: a student who has just been told they did not pass should not
 * have to go looking for where to start. It runs after the verdicts are already stored
 * and rendered, and a failure here only clears the nudge — the judge result stands on
 * its own, so a nudge call that errors costs the student nothing but the nudge.
 */
async function fetchNudge(st, verdicts) {
  S.nudging = true; renderBar();
  try {
    st.nudge = await api("POST", "/api/nudge", judgeContext({
      artifact: st.artifact,
      attempt: st.attempt - 1,  // the attempt that was judged, not the one now open
      verdicts,
      prior_artifacts: priorArtifacts(),
      history: [],
    }));
  } catch (e) {
    st.nudge = null;
    say(`Verdicts are in, but the nudge failed: ${e.message}`, "err");
  } finally {
    S.nudging = false;
    writeSandbox();
    render();
  }
}

async function askHint() {
  const st = sess();
  S.hinting = true; renderBar();
  say("Looking for something to point at…");
  try {
    // No verdicts are sent: a hint reads what the student wrote, which is what lets
    // one be asked for before the first submit. `history` is the conversation seam —
    // empty today, so the server renders the single-shot prompt.
    const h = await api("POST", "/api/hint", judgeContext({
      artifact: st.artifact,
      attempt: st.attempt,
      prior_artifacts: priorArtifacts(),
      history: [],
    }));
    st.hint = h;
    writeSandbox();
    say(`Hint given on ${h.criterion_id}.`, "ok");
  } catch (e) {
    say(e.message, "err");
  } finally {
    S.hinting = false;
    render();
  }
}

async function submitSession() {
  const st = sess();
  S.running = true; S.result = null; renderBar();
  say("Judging…");
  // Set when the judge comes back with failing gates, and acted on after the verdicts
  // are rendered: the student reads what did not pass while the nudge is still being
  // written, rather than watching one spinner for both calls.
  let nudgeOn = null;
  try {
    const r = await api("POST", "/api/judge", judgeContext({
      artifact: st.artifact,
      attempt: st.attempt,
      prior_artifacts: priorArtifacts(),
    }));
    S.result = r;
    st.transcript.push({ attempt: st.attempt, artifact: { ...st.artifact }, verdicts: r.verdicts });
    st.hint = null;   // it was about the artifact as it stood before this submission
    st.nudge = null;  // and so was any nudge: this run's verdicts supersede it
    recordStatus(r.verdicts, S.criteria.criteria, st.attempt);

    // Only a gating criterion holds the student here. An advisory FAIL is judged,
    // recorded, and shown with the rest, but it is feedback on depth rather than a
    // statement that the phase was not met, so it must not cost an attempt.
    const byId = Object.fromEntries((S.criteria.criteria || []).map((c) => [c.id, c]));
    const failed = r.verdicts.filter((v) => v.verdict === "FAIL");
    const blocking = failed.filter((v) => !isAdvisory(byId[v.criterion_id]));
    // A missing verdict is not a pass: the judge failed to rule on that criterion.
    // That holds whatever the criterion's gate — an advisory rule the judge skipped
    // is a broken judge contract, not an advisory FAIL, so it blocks like any other.
    if (!blocking.length && !r.missing_ids.length) {
      st.passed = true;
      const nxt = nextPhase();
      if (nxt) sess(nxt.phase).unlocked = true;
      const extra = failed.length ? ` ${failed.length} advisory not met — worth a look.` : "";
      say((nxt ? `Phase passed — ${nxt.label} unlocked.` : "Phase passed — session complete.") + extra, "ok");
    } else {
      st.attempt += 1;
      const advisory = failed.length - blocking.length;
      const extra = advisory ? ` (${advisory} advisory, not blocking)` : "";
      say(`${blocking.length} of ${r.verdicts.length} criteria failed${extra} — now on attempt ${st.attempt}.`, "err");

      // A failed gate earns a nudge without being asked for. Only gates the judge
      // actually ruled FAIL on can be nudged at, so a run held up solely by
      // `missing_ids` — a broken judge contract, not the student's doing — is left
      // alone rather than sent to a call that would refuse it.
      if (blocking.length) nudgeOn = r.verdicts;
    }
    writeSandbox();
  } catch (e) {
    say(e.message, "err");
  } finally {
    S.running = false;
    render();
  }
  if (nudgeOn) await fetchNudge(st, nudgeOn);
}

// ------------------------------------------------------------------- simulate

/* A persona walks the whole session while you watch. The judge, the nudge and the
 * gating are the real ones against the saved rubric — only the student is synthetic.
 *
 * The transport is Server-Sent Events, which matters for one reason worth stating
 * plainly: an EventSource reconnects by itself when a stream closes, and a reconnect
 * here would silently start a second run and bill for it. So the terminal event closes
 * the socket explicitly, and `simStop` is the only way the connection ever ends.
 */
function renderSimulate() {
  const out = el("div");

  if (S.personas === null) {
    if (!S.personasLoading) {
      S.personasLoading = true;
      api("GET", "/api/personas")
        .then((d) => {
          S.personas = d.personas; S.simCap = d.max_attempts_cap;
          S.personaDoc = { system_prompt: d.system_prompt, model: d.model, version: d.version };
        })
        .catch((e) => { S.personas = []; S.sim.error = e.message; })
        .finally(() => { S.personasLoading = false; render(); });
    }
    out.append(el("div", { className: "card" },
      el("p", { className: "empty", textContent: "Loading personas…" })));
    return out;
  }

  out.append(simControls());
  if (S.sim.error) {
    out.append(el("div", { className: "card" },
      el("div", { className: "note warn", textContent: S.sim.error })));
  }
  if (S.sim.events.length) out.append(renderSimLog());
  return out;
}

function simControls() {
  const running = !!S.sim.es;
  const chosen = S.sim.persona || (S.personas[0] && S.personas[0].id);

  const pick = el("select");
  for (const p of S.personas) {
    const o = el("option", { value: p.id, textContent: p.name });
    if (p.id === chosen) o.selected = true;
    pick.append(o);
  }
  pick.disabled = running;
  pick.onchange = () => { S.sim.persona = pick.value; render(); };

  const attempts = textInput(S.sim.attempts, (v) => { S.sim.attempts = Math.max(1, Number(v) || 1); },
    { type: "number" });
  attempts.disabled = running;
  // Re-render on commit rather than per keystroke: the estimate below depends on this
  // value, and re-rendering on input would take the focus out of the box mid-number.
  attempts.onchange = () => render();

  const problems = problemPicker(async (slug) => { await loadProblem(slug); render(); });
  problems.disabled = running;

  const go = el("button", { className: "act", disabled: running || !S.boot.has_api_key,
    textContent: running ? "Running…" : "Run simulation" });
  go.onclick = simStart;
  const stop = el("button", { className: "act ghost", textContent: "Stop" });
  stop.onclick = () => simStop("Stopped.");

  const card = el("div", { className: "card" }, [
    el("h3", { textContent: "Simulate a student" }),
    el("p", { className: "sub", textContent:
      "An LLM plays a student and works this problem through every phase. The judge, the nudge and "
      + "the gating are the real ones running against the saved criteria — only the student is synthetic. "
      + "A phase that is never passed stops the run, exactly as it would for a real student." }),
    el("div", { className: "row" }, [
      field("Persona", pick),
      field("Problem", problems),
      field("Attempts per phase", attempts, `Capped at ${S.simCap || 8}.`),
    ]),
  ]);

  const who = S.personas.find((p) => p.id === chosen);
  if (who) card.append(el("div", { className: "persona-blurb", textContent: who.blurb }));

  const buttons = el("div", { className: "row", style: "margin-top:12px" }, [go]);
  if (running) buttons.append(stop);
  card.append(buttons);

  if (!S.boot.has_api_key) {
    card.append(el("div", { className: "note warn", style: "margin-top:10px",
      textContent: "No API key set — a simulation is nothing but model calls, so this needs one." }));
  } else if (!running) {
    // Every attempt is up to three calls: the student writes, the judge rules, the nudge
    // answers. Worth saying out loud before someone sets attempts to 8.
    const worst = S.boot.phases.length * Math.max(1, S.sim.attempts) * 3;
    card.append(el("div", { className: "sub", style: "margin-top:10px",
      textContent: `Up to ${worst} model calls if nothing passes first time `
        + `(${S.boot.phases.length} phases × ${S.sim.attempts} attempts × write/judge/nudge).` }));
  }
  return card;
}

function simStart() {
  const persona = S.sim.persona || (S.personas[0] && S.personas[0].id);
  if (!persona) { say("No personas are defined.", "err"); return; }
  simStop();
  S.sim = { es: null, events: [], persona, attempts: S.sim.attempts, error: null };

  const q = new URLSearchParams({
    persona, problem: S.problemSlug, attempts: String(S.sim.attempts),
  });
  const es = new EventSource(`/api/simulate?${q}`);
  S.sim.es = es;
  let terminated = false;

  es.onmessage = (m) => {
    let ev;
    try { ev = JSON.parse(m.data); } catch { return; }
    S.sim.events.push(ev);
    // The stream is about to close on its own; closing first is what stops the browser
    // reconnecting and starting a second run.
    if (ev.type === "done" || (ev.type === "error" && ev.fatal)) {
      terminated = true;
      simStop();
      return;
    }
    if (S.tab === "simulate") render();
  };
  es.onerror = () => {
    if (!terminated) S.sim.error = "The connection to the run dropped. Nothing above is lost; start again to continue.";
    simStop();
  };

  say(`Simulating ${persona} on ${S.problemSlug}…`);
  render();
}

function simStop(msg) {
  if (S.sim.es) { S.sim.es.close(); S.sim.es = null; }
  if (msg) say(msg, "ok");
  if (S.tab === "simulate") render(); else renderBar();
}

function renderSimLog() {
  const log = el("div", { className: "sim-log" });
  for (const ev of S.sim.events) {
    const node = simStep(ev);
    if (node) log.append(node);
  }
  const card = el("div", { className: "card" }, [el("h3", { textContent: "Transcript" }), log]);
  return card;
}

function simStep(ev) {
  const step = (cls, kids) => el("div", { className: `sim-step ${cls}` }, kids);
  const when = (t) => el("div", { className: "when", textContent: t });

  if (ev.type === "start") {
    return step("is-phase", [
      when(`${ev.persona.name} · ${ev.problem.title}`),
      el("h4", { textContent: `${ev.phases.length} phases, up to ${ev.max_attempts} attempts each` }),
    ]);
  }
  if (ev.type === "phase_start") {
    return step("is-phase", [
      when(`Phase ${ev.index + 1} of ${ev.total}`),
      el("h4", { textContent: ev.label }),
    ]);
  }
  if (ev.type === "working") {
    // Only while it is still the newest event — once the result lands it is noise.
    if (S.sim.events[S.sim.events.length - 1] !== ev) return null;
    const what = { writing: "The student is writing…", judging: "Judging against every criterion…",
                   nudging: "Working out what to say next…" }[ev.what] || "Working…";
    return step("", el("div", { className: "sim-work" }, [el("span", { className: "dot" }), el("span", { textContent: what })]));
  }
  if (ev.type === "artifact") {
    const boxes = el("div", { className: "sim-art" });
    for (const f of ev.fields) {
      boxes.append(el("div", { className: "box" }, [
        el("b", { textContent: f.label }),
        el("div", { textContent: f.value || "(left empty)" }),
      ]));
    }
    return step("", [when(`Attempt ${ev.attempt} — submitted`), boxes]);
  }
  if (ev.type === "verdicts") {
    const tally = el("div", { className: "sim-tally" });
    for (const v of ev.verdicts) {
      const cls = v.verdict === "PASS" ? "met" : v.gate === "advisory" ? "adv" : "block";
      tally.append(el("span", { className: `sim-chip ${cls}`, textContent: v.criterion_id }));
    }
    const adv = ev.advisory_unmet.length;
    const head = ev.passed
      ? "Passed" + (adv ? ` — ${adv} advisory not met` : "")
      : `${ev.blocking.length} blocking${adv ? `, ${adv} advisory` : ""}`;
    const kids = [when(`Attempt ${ev.attempt} — judged`), el("h4", { textContent: head }), tally];
    if (ev.missing_ids.length) {
      kids.push(el("div", { className: "note warn", style: "margin-top:8px",
        textContent: `The judge returned no verdict for: ${ev.missing_ids.join(", ")}` }));
    }
    return step(ev.passed ? "is-pass" : "is-fail", kids);
  }
  if (ev.type === "nudge") {
    const box = el("div", { className: "sim-nudge" }, [
      el("div", { className: "sum", textContent: ev.summary }),
      el("div", { className: "focus", textContent: `start here → ${ev.focus_id}` }),
      el("div", { className: "body", textContent: ev.nudge }),
    ]);
    return step("is-nudge", [when("Told to fix one thing"), box]);
  }
  if (ev.type === "phase_done") {
    return step(ev.passed ? "is-pass" : "is-fail", [
      when(`${ev.label} — ${ev.attempts} attempt${ev.attempts > 1 ? "s" : ""}`),
      el("h4", { textContent: ev.passed ? `${ev.label} passed` : `${ev.label} not passed` }),
    ]);
  }
  if (ev.type === "error") {
    return step("is-fail", [
      when(ev.fatal ? "Run stopped" : "Warning"),
      el("div", { className: "note warn", style: "margin-top:6px", textContent: ev.message }),
    ]);
  }
  if (ev.type === "done") {
    const box = el("div", { className: `sim-done ${ev.completed ? "ok" : "no"}` }, [
      el("h4", { textContent: ev.completed ? "Every phase passed" : "Run stopped early" }),
      el("div", { textContent: ev.message }),
    ]);
    const rows = el("div", { className: "sim-tally" });
    for (const p of ev.phases) {
      rows.append(el("span", { className: `sim-chip ${p.passed ? "met" : "block"}`,
        textContent: `${p.label}: ${p.attempts} attempt${p.attempts > 1 ? "s" : ""}` }));
    }
    box.append(rows);
    box.append(el("div", { className: "cost", textContent:
      `${ev.usage.calls} model calls · ${ev.usage.input_tokens} in / ${ev.usage.output_tokens} out` }));
    return step(ev.completed ? "is-pass" : "is-fail", box);
  }
  return null;
}

// ------------------------------------------------------------------- personas

/* Read-only. Personas are authored in prompts/base/personas.yaml; this is where you
 * read one, and — the part a template cannot show you — the exact prompt it would be
 * sent, rendered by the server without spending a token.
 */
const HELP_SEEKING_NOTE = {
  never: "Never asks for help.",
  when_stuck: "Presses the help button after a failed attempt.",
  eager: "Presses the help button before writing anything.",
};

function renderPersonas() {
  const out = el("div");

  if (S.personas === null) {
    if (!S.personasLoading) {
      S.personasLoading = true;
      api("GET", "/api/personas")
        .then((d) => {
          S.personas = d.personas; S.simCap = d.max_attempts_cap;
          S.personaDoc = { system_prompt: d.system_prompt, model: d.model, version: d.version };
        })
        .catch((e) => { S.personas = []; S.pv.error = e.message; })
        .finally(() => { S.personasLoading = false; render(); });
    }
    out.append(el("div", { className: "card" },
      el("p", { className: "empty", textContent: "Loading personas…" })));
    return out;
  }

  const doc = S.personaDoc || {};
  out.append(el("div", { className: "card" }, [
    el("h3", { textContent: "Student personas" }),
    el("p", { className: "sub", textContent:
      `${S.personas.length} characters in prompts/base/personas.yaml (v${doc.version || 1}). `
      + "Each is a student the Simulate tab can put through a whole session. Edit them in the "
      + "file — this view is read-only, so a run and this page can never disagree." }),
  ]));

  if (S.pv.error) {
    out.append(el("div", { className: "card" },
      el("div", { className: "note warn", textContent: S.pv.error })));
  }

  for (const p of S.personas) out.append(personaCard(p));

  // The system prompt is shared by every character, so it sits once at the bottom
  // rather than being repeated in each card as if it varied.
  if (doc.system_prompt) {
    const box = el("div", { className: "card" }, [
      el("h3", { textContent: "Shared system prompt" }),
      el("p", { className: "sub", textContent:
        "Every persona is sent this. The character itself arrives in the user turn — same shape "
        + "as the judge, hint and nudge documents." }),
      el("pre", { className: "preview", textContent: doc.system_prompt }),
    ]);
    out.append(box);
  }
  return out;
}

function personaCard(p) {
  const open = S.pv.open === p.id;
  const head = el("div", { className: "head" }, [
    el("div", { className: "cid", textContent: p.id }),
    el("span", { className: "gate", textContent: p.help_seeking.replace("_", " ") }),
  ]);

  const card = el("div", { className: "card" }, [
    el("h3", { textContent: p.name }),
    head,
    el("p", { className: "sub", style: "margin-top:8px", textContent: p.blurb }),
  ]);

  const toggle = el("button", { className: "mini",
    textContent: open ? "Hide the prompt" : "Show what this persona is sent" });
  toggle.onclick = () => {
    S.pv.open = open ? null : p.id;
    S.pv.prompt = null;
    if (!open) loadPersonaPreview(p.id);
    render();
  };
  card.append(el("div", { className: "row", style: "margin-top:4px" }, [toggle]));

  if (!open) return card;

  card.append(el("h3", { textContent: "Character", style: "margin-top:14px; font-size:13px" }));
  card.append(el("pre", { className: "preview", textContent: p.behaviour }));

  const stages = el("div", { className: "row", style: "margin-top:12px; align-items:center" });
  for (const [id, label] of [["first", "First attempt"], ["retry", "After a failed attempt"]]) {
    const b = el("button", { className: `mini ${S.pv.stage === id ? "on" : ""}`, textContent: label });
    b.onclick = () => { S.pv.stage = id; S.pv.prompt = null; loadPersonaPreview(p.id); render(); };
    stages.append(b);
  }
  card.append(el("h3", { textContent: "The user turn", style: "margin-top:16px; font-size:13px" }));
  card.append(el("p", { className: "sub", textContent:
    `Rendered against ${S.phase.label} and ${S.problemSlug}, exactly as a run would send it. `
    + "Switch phase or problem from the strip above to see another." }));
  card.append(stages);

  if (S.pv.loading) {
    card.append(el("p", { className: "empty", textContent: "Rendering…" }));
  } else if (S.pv.prompt) {
    if (S.pv.prompt.sampled) {
      card.append(el("div", { className: "note", style: "margin-top:10px", textContent:
        "The bracketed lines stand in for a real verdict, nudge or hint — this page renders no "
        + "model call, so there is nothing real to put there." }));
    }
    card.append(el("pre", { className: "preview", textContent: S.pv.prompt.user_prompt }));
  }
  return card;
}

async function loadPersonaPreview(personaId) {
  S.pv.loading = true; S.pv.error = null;
  try {
    S.pv.prompt = await api("POST", "/api/persona-preview", {
      persona: personaId, phase_id: S.phaseId, problem_id: S.problemSlug, stage: S.pv.stage,
    });
  } catch (e) {
    S.pv.error = e.message; S.pv.prompt = null;
  } finally {
    S.pv.loading = false; render();
  }
}

// --------------------------------------------------------------------- render

function render() {
  renderChrome();
  const views = {
    session: renderSession, rubric: renderRubric, criteria: renderCriteria,
    problem: renderProblem, prompt: renderPrompt, run: renderRun,
    simulate: renderSimulate, personas: renderPersonas,
  };
  $("#main").replaceChildren(views[S.tab]());
  renderBar();
}

window.addEventListener("beforeunload", (e) => {
  if (anyDirty()) { e.preventDefault(); e.returnValue = ""; }
});

(async function start() {
  try {
    S.boot = await api("GET", "/api/bootstrap");
    if (!S.boot.phases.length) throw new Error("No phases found in prompts/phases/.");
    if (!S.boot.problems.length) throw new Error("No problems found in cases/problems/.");
    await loadPhase(S.boot.phases[0].phase);
    await loadProblem(S.boot.problems[0].slug);
    await loadRubric();
    render();
  } catch (e) {
    document.body.append(el("main", {}, el("div", { className: "card" }, [
      el("h3", { textContent: "Could not start" }),
      el("p", { textContent: e.message }),
    ])));
  }
})();
</script>
</body>
