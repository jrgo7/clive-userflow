<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLive Studio</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #f0f2f5;
  --line: #d9dee5;
  --ink: #16191d;
  --ink-2: #5c6673;
  --accent: #3355cc;
  --accent-ink: #ffffff;
  --pass: #1a7f4b;
  --pass-bg: #e4f4ea;
  --fail: #b3261e;
  --fail-bg: #fbe7e6;
  --warn: #8a5a00;
  --warn-bg: #fdf1dc;
  --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c;
    --panel: #1c2027;
    --panel-2: #23282f;
    --line: #333a44;
    --ink: #e6e9ee;
    --ink-2: #97a1af;
    --accent: #7d9bff;
    --accent-ink: #10131a;
    --pass: #6ddc9b;
    --pass-bg: #14301f;
    --fail: #ff9a92;
    --fail-bg: #331a19;
    --warn: #f0c274;
    --warn-bg: #33280f;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--sans);
}
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.brand { font-weight: 650; letter-spacing: .2px; }
.brand span { color: var(--ink-2); font-weight: 400; }
.spacer { flex: 1; }
.pill {
  font-size: 12px; padding: 3px 9px; border-radius: 999px;
  background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line);
}
.pill.bad { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
a.mini { text-decoration: none; display: inline-flex; align-items: center; }

/* ---- simulate ------------------------------------------------------------ */
/* The transcript is a timeline, so it reads down a rule with each step hung off it. */
.sim-log { border-left: 2px solid var(--line); margin: 4px 0 0 7px; padding: 0 0 0 18px; }
.sim-step { position: relative; padding: 10px 0; }
.sim-step::before {
  content: ""; position: absolute; left: -25px; top: 16px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--line-2, var(--line));
}
.sim-step.is-phase::before { background: var(--accent); border-color: var(--accent); }
.sim-step.is-pass::before  { background: var(--pass);   border-color: var(--pass); }
.sim-step.is-fail::before  { background: var(--fail);   border-color: var(--fail); }
.sim-step.is-nudge::before { background: var(--fail);   border-color: var(--panel); }
.sim-step .when {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-2);
}
.sim-step h4 { margin: 2px 0 0; font-size: 14.5px; }
.sim-step.is-phase h4 { font-size: 16px; color: var(--accent); }
.sim-work { display: flex; align-items: center; gap: 9px; color: var(--ink-2); font-size: 13px; }
.sim-work .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  animation: simpulse 1.1s ease-in-out infinite;
}
@keyframes simpulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sim-work .dot { animation: none; opacity: .7; } }
.sim-art { margin-top: 8px; display: grid; gap: 8px; }
.sim-art .box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
.sim-art .box b { display: block; font-size: 11.5px; color: var(--ink-2); font-weight: 600; margin-bottom: 3px; }
.sim-art .box div { white-space: pre-wrap; font-size: 13.5px; }
.sim-tally { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.sim-chip {
  font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 5px;
  border: 1px solid var(--line); color: var(--ink-2);
}
.sim-chip.met  { background: var(--pass-bg); color: var(--pass); border-color: transparent; }
.sim-chip.block{ background: var(--fail-bg); color: var(--fail); border-color: transparent; }
.sim-chip.adv  { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.sim-nudge { margin-top: 8px; border-left: 3px solid var(--fail); background: var(--panel-2);
             border-radius: 0 8px 8px 0; padding: 10px 13px; }
.sim-nudge .sum { font-size: 14px; margin-bottom: 6px; }
.sim-nudge .focus { font-family: var(--mono); font-size: 11.5px; color: var(--fail); }
.sim-nudge .body { font-size: 13.5px; margin-top: 6px; white-space: pre-wrap; }
.sim-done { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 12px; }
.sim-done.ok { background: var(--pass-bg); border-color: transparent; }
.sim-done.no { background: var(--fail-bg); border-color: transparent; }
.sim-done h4 { margin: 0 0 6px; font-size: 15px; }
.sim-done .cost { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); margin-top: 8px; }
.persona-blurb { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; max-width: 70ch; }

nav.phases { display: flex; gap: 6px; }
nav.phases button {
  font: inherit; padding: 6px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink-2);
}
nav.phases button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

nav.tabs {
  display: flex; gap: 2px; padding: 0 18px; background: var(--panel);
  border-bottom: 1px solid var(--line); position: sticky; top: 51px; z-index: 4;
}
nav.tabs button {
  font: inherit; padding: 9px 14px; cursor: pointer; color: var(--ink-2);
  background: none; border: none; border-bottom: 2px solid transparent;
}
nav.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

main { max-width: 1060px; margin: 0 auto; padding: 20px 18px 80px; }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 12px;
}
.card h3 { margin: 0 0 4px; font-size: 14px; }
.card .sub { color: var(--ink-2); font-size: 12.5px; margin: 0 0 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > .f { flex: 1 1 180px; }
label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
input, select, textarea {
  font: inherit; width: 100%; padding: 7px 9px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
}
textarea { resize: vertical; min-height: 60px; }
textarea.mono, input.mono, pre { font-family: var(--mono); font-size: 12.5px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

button.act {
  font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
button.ghost { border: 1px solid var(--line); background: transparent; color: var(--ink); font-weight: 500; }
button.danger { border-color: transparent; background: var(--fail-bg); color: var(--fail); }
button.act:disabled { opacity: .45; cursor: not-allowed; }
button.mini {
  font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2);
}
/* A pressed state for mini buttons used as a segmented choice, not an action. */
button.mini.on { border-color: var(--accent); color: var(--accent); background: transparent; }

.item { border: 1px solid var(--line); border-radius: 9px; padding: 12px; margin-bottom: 10px; background: var(--panel-2); }
.item .head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.item .head .grip { color: var(--ink-2); font-size: 12px; min-width: 22px; }

.bar {
  position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 18px;
  background: var(--panel); border-top: 1px solid var(--line);
  display: flex; gap: 10px; align-items: center; justify-content: flex-end;
}
.bar .msg { margin-right: auto; font-size: 13px; color: var(--ink-2); }
.bar .msg.err { color: var(--fail); }
.bar .msg.ok { color: var(--pass); }

pre.preview {
  white-space: pre-wrap; word-break: break-word; background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 12px;
  max-height: 460px; overflow: auto; margin: 0;
}
.verdict { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 8px; background: var(--panel-2); }
.badge { font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 6px; height: fit-content; letter-spacing: .4px; }
.badge.PASS { background: var(--pass-bg); color: var(--pass); }
.badge.FAIL { background: var(--fail-bg); color: var(--fail); }
.gate { font-size: 11px; letter-spacing: .3px; text-transform: uppercase; color: var(--ink-2);
        background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px;
        padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
.verdict .body { flex: 1; min-width: 0; }
.verdict .cid { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
.verdict .meta { color: var(--ink-2); font-size: 12px; margin: 2px 0 6px; }
.verdict blockquote {
  margin: 0; padding: 7px 10px; border-left: 3px solid var(--line);
  background: var(--bg); font-family: var(--mono); font-size: 12.5px;
  white-space: pre-wrap; word-break: break-word;
}
.note { padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.hint-card { border-left: 3px solid var(--accent); }
.hint-card .diagnosis { font-size: 15px; line-height: 1.45; margin-bottom: 10px; }
.hint-card .body { white-space: pre-wrap; }
.hint-card .points-at { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
                        font-size: 12.5px; color: var(--ink-2); }
.hint-card .cid { font-family: var(--mono); font-size: 12px; font-weight: 600; }
/* A nudge is the same shape as a hint but about a failure, so it borrows the layout
   and only changes the accent that says which of the two you are reading. */
.nudge-card { border-left: 3px solid var(--fail); }
.nudge-card .summary { font-size: 15px; line-height: 1.45; margin-bottom: 12px; }
.nudge-card .outstanding { margin: 0 0 12px; padding: 0; list-style: none;
                           font-size: 12.5px; color: var(--ink-2); }
.nudge-card .outstanding li { padding: 4px 0; border-bottom: 1px solid var(--line); }
.nudge-card .outstanding li:last-child { border-bottom: 0; }
.nudge-card .outstanding .cid { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.nudge-card .outstanding li.focus { color: var(--ink); }
.nudge-card .start-here { font-size: 11px; letter-spacing: .3px; text-transform: uppercase;
                          color: var(--fail); margin-left: 6px; }
.nudge-card .body { white-space: pre-wrap; }
.nudge-card .reason { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.empty { color: var(--ink-2); font-style: italic; padding: 6px 0; }
.hint { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
.tag { font-family: var(--mono); font-size: 12px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }

.pill.sandbox { background: var(--warn-bg); color: var(--warn); border-color: transparent; font-weight: 600; }
.track { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.track .step {
  flex: 1 1 150px; padding: 8px 12px; border-radius: 9px; font-size: 12px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2);
}
.track .step b { display: block; font-size: 13.5px; color: var(--ink); }
.track .step.current { border-color: var(--accent); }
.track .step.passed { background: var(--pass-bg); border-color: transparent; color: var(--pass); }
.track .step.passed b { color: var(--pass); }
.track .step.locked { opacity: .45; }
.task {
  background: var(--panel-2); border-left: 3px solid var(--accent);
  padding: 11px 14px; border-radius: 0 8px 8px 0; margin-bottom: 14px; white-space: pre-wrap;
}
.attempt-row { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
.attempt-row .n { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }

.badge.stale { background: var(--warn-bg); color: var(--warn); }
.badge.unjudged { background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); }
.rub-head {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
}
.rub-head h3 { margin: 0; }
.rub-head .count { color: var(--ink-2); font-size: 12px; margin-left: auto; }
.rub-row { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.rub-row:last-child { border-bottom: none; }
.rub-row .body { flex: 1; min-width: 0; }
.rub-row .cid { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.rub-row details { margin-top: 6px; }
.rub-row summary { cursor: pointer; font-size: 12px; color: var(--ink-2); }
.rub-row .guide { white-space: pre-wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <div class="brand">CLive Studio <span>&nbsp;PCDIT authoring</span></div>
  <nav class="phases" id="phaseNav"></nav>
  <div class="spacer"></div>
  <div class="pill" id="tallyPill" title="Across every phase, for the current problem"></div>
  <div class="pill sandbox" id="modePill" hidden>Sandbox — nothing is written to disk</div>
  <button class="mini" id="modeToggle">…</button>
  <!-- The student view. Not a tab: it is a different app for a different person,
       and opening it in a new tab keeps an authoring session from being lost. -->
  <a class="mini" href="/student" target="_blank" rel="noopener"
     title="What a student sees — judged against the saved files, never the sandbox">Student view</a>
  <div class="pill" id="keyPill">…</div>
</header>

<nav class="tabs" id="tabNav"></nav>
<main id="main"></main>

<div class="bar">
  <div class="msg" id="msg"></div>
  <div id="barActions"></div>
</div>

<script>
"use strict";

const TABS = [
  { id: "session",  label: "Session", sandboxOnly: true },
  { id: "rubric",   label: "Rubric" },
  { id: "criteria", label: "Criteria" },
  { id: "problem",  label: "Problem" },
  { id: "prompt",   label: "Prompt" },
  { id: "run",      label: "Run", filesOnly: true },
  // Cross-phase, like Rubric: a simulation walks every phase, so it is not about
  // the one selected in the phase strip. Files-only — a run judges the saved
  // rubric, which is the thing it exists to tell you about.
  { id: "simulate", label: "Simulate", filesOnly: true },
  // Read-only: personas are authored in prompts/base/personas.yaml. This is where
  // you read what a character actually gets sent, which a template cannot show you.
  { id: "personas", label: "Personas", filesOnly: true },
];

const S = {
  boot: null,
  phaseId: null, phase: null, criteria: null,
  problemSlug: null, problem: null,
  tab: "criteria",
  dirty: { criteria: false, problem: false, prompt: false },
  preview: null, result: null, running: false, hinting: false, nudging: false,
  // The simulation: the persona roster, the live event log, and the EventSource
  // while one is running. `sim.es` being non-null is what "a run is in flight" means.
  personas: null, personasLoading: false, simCap: 8, personaDoc: null,
  // Personas tab: which character is open, which prompt shape is shown, and the
  // rendered prompt once the server has returned it.
  pv: { open: null, stage: "first", prompt: null, loading: false, error: null },
  sim: { es: null, events: [], persona: null, attempts: 3, error: null },
  // "files": S.phase / S.criteria / S.problem come from the server and saves write
  // YAML. "sandbox": they are references into S.sandbox and nothing touches disk.
  // The editors are identical either way — only the source and the save differ.
  mode: "files",
  sandbox: null,
  // Every phase's criteria, fetched once and refreshed after an edit. The header
  // tally recomputes on every render, so this must never be a per-render fetch.
  rubric: null,
};

const visibleTabs = () =>
  TABS.filter((t) => !(t.sandboxOnly && S.mode !== "sandbox") && !(t.filesOnly && S.mode !== "files"));

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};
const esc = (s) => String(s ?? "");

// ------------------------------------------------------------------ transport

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data;
  try { data = await res.json(); } catch { throw new Error(`${res.status} ${res.statusText}`); }
  if (!res.ok) throw new Error(data.error || `${res.status}`);
  return data;
}

let msgTimer = null;
function say(text, kind = "") {
  const m = $("#msg");
  m.textContent = text;
  m.className = "msg " + kind;
  clearTimeout(msgTimer);
  if (kind === "ok") msgTimer = setTimeout(() => { m.textContent = ""; }, 3500);
}

// ---------------------------------------------------------------------- state

function markDirty(which) { S.dirty[which] = true; renderBar(); }

function anyDirty() { return Object.values(S.dirty).some(Boolean); }

function confirmLeave() {
  if (!anyDirty()) return true;
  return confirm("You have unsaved changes. Discard them?");
}

async function loadPhase(phaseId) {
  if (S.mode === "sandbox") {
    // A phase added to disk after the snapshot was taken has no scratch copy yet.
    if (!S.sandbox.phases[phaseId]) {
      const d = await api("GET", `/api/phase/${phaseId}`);
      S.sandbox.phases[phaseId] = d.phase;
      S.sandbox.criteria[phaseId] = d.criteria;
      writeSandbox();
    }
    S.phase = S.sandbox.phases[phaseId];
    S.criteria = S.sandbox.criteria[phaseId];
  } else {
    const d = await api("GET", `/api/phase/${phaseId}`);
    S.phase = d.phase;
    S.criteria = d.criteria;
  }
  S.phaseId = phaseId;
  S.dirty = { criteria: false, problem: S.dirty.problem, prompt: false };
  S.preview = null;
  S.result = null;
}

async function loadProblem(slug) {
  if (S.mode === "sandbox") {
    if (!S.sandbox.problems[slug]) {
      S.sandbox.problems[slug] = (await api("GET", `/api/problem/${slug}`)).problem;
      writeSandbox();
    }
    S.problem = S.sandbox.problems[slug];
  } else {
    const d = await api("GET", `/api/problem/${slug}`);
    S.problem = d.problem;
  }
  S.problemSlug = slug;
  S.dirty.problem = false;
}

// Keep whatever the user typed into the Run form, per phase + problem, so
// switching tabs to tweak a criterion does not throw the submission away.
const draftKey = () => `clive.draft.${S.phaseId}.${S.problemSlug}`;
function readDraft() {
  try { return JSON.parse(localStorage.getItem(draftKey()) || "{}"); } catch { return {}; }
}
function writeDraft(artifact) {
  try { localStorage.setItem(draftKey(), JSON.stringify(artifact)); } catch { /* private mode */ }
}
// The attempt counter shares the draft record but is not an artifact field.
function artifactFromDraft() {
  const { __attempt, ...artifact } = readDraft();
  return artifact;
}

// Discarding has to re-read from disk: the editors mutate S.phase / S.criteria /
// S.problem in place, so clearing the dirty flag alone would leave the abandoned
// edits sitting in memory, ready to be written by the next save.
async function reloadAll() {
  // In sandbox the editors mutate the scratch objects in place, so "discard" means
  // re-reading the last persisted store rather than re-fetching from the server.
  if (S.mode === "sandbox") S.sandbox = readSandbox() || S.sandbox;
  await loadPhase(S.phaseId);
  await loadProblem(S.problemSlug);
  resetDirty();
}

// --------------------------------------------------------------------- status

const STATUS_KEY = "clive.status.v1";

/**
 * Cheap synchronous hash (djb2) of what a criterion actually asks.
 *
 * This, not `criteria_version`, is what decides whether a stored verdict is still
 * trustworthy: the version is a human-maintained label that can be bumped without a
 * wording change or changed without a bump, whereas the hash is a fact about the text
 * the judge was given. crypto.subtle would be stronger and is async, which would drag
 * render() into promise-land for no benefit — collisions here cost a stale marker, not
 * correctness.
 */
function criterionHash(c) {
  const s = `${c.text || ""}\u0000${c.guidance || ""}`;
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

function readStatus() {
  try { return JSON.parse(localStorage.getItem(STATUS_KEY) || "{}"); } catch { return {}; }
}

function writeStatus(store) {
  try { localStorage.setItem(STATUS_KEY, JSON.stringify(store)); } catch { /* private mode */ }
}

/** Statuses for one mode and problem. File and sandbox verdicts are kept in separate
 *  buckets so an experiment against a gutted rubric never reads as the real thing. */
function statusBucket(mode = S.mode, problem = S.problemSlug) {
  return (readStatus()[mode] || {})[problem] || {};
}

/** The single writer, called after every judged run in either mode. */
function recordStatus(verdicts, criteria, attempt) {
  const store = readStatus();
  const byMode = (store[S.mode] = store[S.mode] || {});
  const byProblem = (byMode[S.problemSlug] = byMode[S.problemSlug] || {});
  const hashes = Object.fromEntries(criteria.map((c) => [c.id, criterionHash(c)]));

  const kept = {};
  for (const v of verdicts) {
    // A verdict for an id no longer in the rubric is dropped, which is also how an
    // orphaned entry from a deleted criterion gets pruned.
    if (!(v.criterion_id in hashes)) continue;
    kept[v.criterion_id] = {
      verdict: v.verdict,
      confidence: v.confidence,
      evidence: v.evidence,
      evidence_found: v.evidence_found,
      hash: hashes[v.criterion_id],
    };
  }

  byProblem[S.phaseId] = {
    criteria_version: (S.criteria && S.criteria.version) || 1,
    judged_at: new Date().toISOString(),
    attempt,
    verdicts: kept,
  };
  writeStatus(store);
}

/** Every phase's criteria for the active mode, newest first by phase order. */
function allRubrics() {
  if (S.mode === "sandbox" && S.sandbox) {
    // seedSandbox already snapshotted every phase, so this needs no fetch.
    return S.boot.phases.map((p) => {
      const doc = S.sandbox.criteria[p.phase] || { version: 1, criteria: [] };
      return {
        phase: p.phase,
        label: (S.sandbox.phases[p.phase] || {}).label || p.label,
        criteria_version: doc.version || 1,
        criteria: doc.criteria || [],
      };
    });
  }
  return S.rubric || [];
}

async function loadRubric() {
  try {
    S.rubric = (await api("GET", "/api/rubric")).rubric;
  } catch (e) {
    say(e.message, "err");
  }
}

/**
 * What one criterion's status is right now. Four outcomes: PASS, FAIL, "stale"
 * (judged, but the wording changed since), and "unjudged" (added since the last run,
 * or never run at all).
 */
function statusOf(bucket, phaseId, criterion) {
  const stored = ((bucket[phaseId] || {}).verdicts || {})[criterion.id];
  if (!stored) return { state: "unjudged" };
  const stale = stored.hash !== criterionHash(criterion);
  return { ...stored, stale, state: stale ? "stale" : stored.verdict };
}

/** Counts across every phase, for the header pill and the per-phase headings. */
function tally(groups, bucket) {
  const out = { total: 0, PASS: 0, FAIL: 0, stale: 0, unjudged: 0 };
  for (const g of groups) {
    for (const c of g.criteria) {
      out.total++;
      out[statusOf(bucket, g.phase, c).state]++;
    }
  }
  return out;
}

// -------------------------------------------------------------------- sandbox

const SANDBOX_KEY = "clive.sandbox.v1";

function writeSandbox() {
  try { localStorage.setItem(SANDBOX_KEY, JSON.stringify(S.sandbox)); }
  catch { say("Sandbox is too large for browser storage; changes are in memory only.", "err"); }
}

function readSandbox() {
  try { return JSON.parse(localStorage.getItem(SANDBOX_KEY) || "null"); } catch { return null; }
}

/** Snapshot every phase, rubric, and problem from disk into a scratch copy. */
async function seedSandbox() {
  const box = { phases: {}, criteria: {}, problems: {}, session: null, settings: { carryForward: false } };
  for (const p of S.boot.phases) {
    const d = await api("GET", `/api/phase/${p.phase}`);
    box.phases[p.phase] = d.phase;
    box.criteria[p.phase] = d.criteria;
  }
  for (const pr of S.boot.problems) {
    box.problems[pr.slug] = (await api("GET", `/api/problem/${pr.slug}`)).problem;
  }
  box.session = freshSession(S.problemSlug || S.boot.problems[0].slug);
  return box;
}

/** A new run through the phases: only the first is unlocked. */
function freshSession(problemSlug) {
  const phases = {};
  S.boot.phases.forEach((p, i) => {
    phases[p.phase] = { attempt: 1, passed: false, unlocked: i === 0, artifact: {}, transcript: [] };
  });
  return { problem: problemSlug, phases };
}

function sess(phaseId) {
  const id = phaseId || S.phaseId;
  const phases = S.sandbox.session.phases;
  if (!phases[id]) {
    phases[id] = { attempt: 1, passed: false, unlocked: false, artifact: {}, transcript: [] };
  }
  return phases[id];
}

/**
 * What earlier phases produced, for the carry-forward toggle. Only phases before
 * this one in `order`, and only those actually submitted — an empty list keeps the
 * EARLIER PHASES block out of the prompt entirely.
 */
function priorArtifacts() {
  if (!S.sandbox || !S.sandbox.settings.carryForward) return [];
  const out = [];
  for (const p of S.boot.phases) {
    if (p.phase === S.phaseId) break;
    const st = sess(p.phase);
    const phase = S.sandbox.phases[p.phase];
    const fields = (phase.artifact_fields || [])
      .filter((f) => (st.artifact[f.id] || "").trim())
      .map((f) => ({ label: f.label || f.id, value: st.artifact[f.id] }));
    if (fields.length) out.push({ label: phase.label || p.phase, fields });
  }
  return out;
}

/** The request body for /api/judge and /api/preview. */
function judgeContext(extra = {}) {
  const body = { phase_id: S.phaseId, problem: S.problemSlug, ...extra };
  if (S.mode === "sandbox") {
    // Send the scratch copy so the server judges what is on screen, not on disk.
    body.phase = S.phase;
    body.criteria = S.criteria.criteria;
    body.problem = S.problem;
  }
  return body;
}

async function setMode(mode) {
  if (mode === S.mode) return;
  if (!confirmLeave()) return;
  if (mode === "sandbox") {
    S.sandbox = readSandbox();
    if (!S.sandbox) {
      say("Seeding sandbox from the current files…");
      S.sandbox = await seedSandbox();
      writeSandbox();
    }
  }
  S.mode = mode;
  resetDirty();
  await loadPhase(S.phaseId);
  await loadProblem(S.mode === "sandbox" ? S.sandbox.session.problem : S.problemSlug);
  if (!visibleTabs().some((x) => x.id === S.tab)) S.tab = mode === "sandbox" ? "session" : "run";
  say(mode === "sandbox" ? "Sandbox on — edits stay in the browser." : "Back on the real files.", "ok");
  render();
}

async function resetSandbox() {
  if (!confirm("Discard every sandbox edit and re-seed from the files on disk?")) return;
  S.sandbox = await seedSandbox();
  writeSandbox();
  resetDirty();
  await loadPhase(S.phaseId);
  await loadProblem(S.sandbox.session.problem);
  say("Sandbox re-seeded from disk.", "ok");
  render();
}

async function promote() {
  const parts = [];
  if (confirm(`Write the sandbox copy of "${S.phase.label}" back to the real files?

OK = phase prompt + criteria + problem.`)) {
    parts.push("phase", "criteria", "problem");
  } else return;
  try {
    const d = await api("POST", "/api/promote", {
      parts,
      phase_id: S.phaseId,
      problem_id: S.problemSlug,
      phase: S.phase,
      criteria_doc: S.criteria,
      problem: S.problem,
    });
    S.boot.phases = d.phases;
    S.boot.problems = d.problems;
    await loadRubric();
    say(`Wrote ${d.written.join(", ")}`, "ok");
    render();
  } catch (e) { say(e.message, "err"); }
}

// --------------------------------------------------------------------- chrome

function renderChrome() {
  const nav = $("#phaseNav");
  nav.replaceChildren(...S.boot.phases.map((p) => {
    const b = el("button", { textContent: p.label, className: p.phase === S.phaseId ? "on" : "" });
    b.title = `${p.phase} · v${p.version}`;
    b.onclick = async () => {
      if (p.phase === S.phaseId || !confirmLeave()) return;
      // loadPhase re-reads the phase and its criteria; the problem is separate,
      // so a discarded problem edit has to be thrown away explicitly.
      if (S.dirty.problem) await loadProblem(S.problemSlug);
      resetDirty();
      await loadPhase(p.phase);
      render();
    };
    return b;
  }));

  const tabs = $("#tabNav");
  tabs.replaceChildren(...visibleTabs().map((t) => {
    const b = el("button", { textContent: t.label, className: t.id === S.tab ? "on" : "" });
    b.onclick = async () => {
      if (!confirmLeave()) return;
      if (anyDirty()) await reloadAll();
      S.tab = t.id;
      render();
    };
    return b;
  }));

  const pill = $("#keyPill");
  pill.textContent = S.boot.has_api_key
    ? `${S.boot.provider} key loaded`
    : "no API key — judging disabled";
  pill.className = S.boot.has_api_key ? "pill" : "pill bad";

  // Cross-phase tally, recomputed from cached state on every render — no fetch here.
  const t = tally(allRubrics(), statusBucket());
  const tallyPill = $("#tallyPill");
  tallyPill.textContent = t.total
    ? `${t.PASS}/${t.total} passing` + (t.stale ? ` · ${t.stale} stale` : "")
    : "no criteria";
  tallyPill.className = t.stale ? "pill bad" : "pill";
  tallyPill.onclick = () => { if (confirmLeave()) { S.tab = "rubric"; render(); } };
  tallyPill.style = "cursor:pointer";

  $("#modePill").hidden = S.mode !== "sandbox";
  const toggle = $("#modeToggle");
  toggle.textContent = S.mode === "sandbox" ? "Leave sandbox" : "Enter sandbox";
  toggle.onclick = () => setMode(S.mode === "sandbox" ? "files" : "sandbox");
}

function resetDirty() { S.dirty = { criteria: false, problem: false, prompt: false }; }

function renderBar() {
  const box = $("#barActions");
  const kids = [];

  if (S.mode === "sandbox" && S.tab !== "session" && S.tab !== "rubric") {
    const reset = el("button", { className: "act ghost", textContent: "Reset sandbox" });
    reset.onclick = resetSandbox;
    const push = el("button", { className: "act ghost", textContent: "Promote to files" });
    push.onclick = promote;
    kids.push(reset, push);
  }

  if (S.tab === "criteria") kids.push(saveButton("criteria", saveCriteria));
  if (S.tab === "problem") kids.push(saveButton("problem", saveProblem));
  if (S.tab === "prompt") kids.push(saveButton("prompt", savePhase));
  if (S.tab === "run" || S.tab === "session") {
    const busy = S.running || S.hinting || S.nudging;
    if (S.tab === "session") {
      // A hint reads the artifact, not the verdicts, so it is offered from the first
      // moment the form is on screen rather than only after a failed submit.
      const h = el("button", {
        className: "act ghost",
        textContent: S.hinting ? "Thinking…" : "I'm stuck — get a hint",
        disabled: busy || !S.boot.has_api_key || !sess().unlocked,
      });
      h.onclick = askHint;
      kids.push(h);
    }
    const b = el("button", {
      className: "act",
      textContent: S.running ? "Judging…" : S.tab === "session" ? "Submit for judging" : "Run judge",
      disabled: busy || !S.boot.has_api_key,
    });
    b.onclick = S.tab === "session" ? submitSession : runJudge;
    kids.push(b);
  }
  box.replaceChildren(...kids);
}

function saveButton(which, fn) {
  // In sandbox the button still exists so the editors behave the same way, but it
  // commits to the scratch copy rather than to a file.
  const label = S.mode === "sandbox" ? "Apply to sandbox" : "Save changes";
  const b = el("button", {
    className: "act",
    textContent: S.dirty[which] ? label : "Saved",
    disabled: !S.dirty[which],
  });
  b.onclick = fn;
  return b;
}

/** Sandbox saves are a localStorage write — the editors mutate the scratch objects
 *  in place, so committing is just persisting the store. Returns true if handled. */
function savedToSandbox(which, what) {
  if (S.mode !== "sandbox") return false;
  writeSandbox();
  S.dirty[which] = false;
  say(`${what} applied to the sandbox — no file written.`, "ok");
  render();
  return true;
}

// ---------------------------------------------------------------------- forms

function field(labelText, node, hint) {
  const wrap = el("div", { className: "f" }, [el("label", { textContent: labelText }), node]);
  if (hint) wrap.append(el("div", { className: "hint", textContent: hint }));
  return wrap;
}

function textInput(value, oninput, opts = {}) {
  const i = el("input", { value: esc(value), className: opts.mono ? "mono" : "" });
  if (opts.type) i.type = opts.type;
  if (opts.placeholder) i.placeholder = opts.placeholder;
  i.oninput = () => oninput(i.value);
  return i;
}

function textArea(value, oninput, rows = 4, mono = false) {
  const t = el("textarea", { value: esc(value), rows, className: mono ? "mono" : "" });
  t.oninput = () => oninput(t.value);
  return t;
}

function selectInput(value, options, oninput) {
  const s = el("select");
  for (const o of options) {
    const opt = el("option", { value: o, textContent: o });
    if (o === value) opt.selected = true;
    s.append(opt);
  }
  s.onchange = () => oninput(s.value);
  return s;
}

function reorderControls(list, index, onchange) {
  const up = el("button", { className: "mini", textContent: "↑", disabled: index === 0 });
  const down = el("button", { className: "mini", textContent: "↓", disabled: index === list.length - 1 });
  up.onclick = () => { [list[index - 1], list[index]] = [list[index], list[index - 1]]; onchange(); };
  down.onclick = () => { [list[index + 1], list[index]] = [list[index], list[index + 1]]; onchange(); };
  return [up, down];
}

// ------------------------------------------------------------------- criteria

function renderCriteria() {
  const c = S.criteria;
  const out = el("div");

  out.append(el("div", { className: "card" }, [
    el("h3", { textContent: `Criteria — ${S.phase.label}` }),
    el("p", {
      className: "sub",
      textContent: "One PASS/FAIL rule each. The judge returns exactly one verdict per criterion, "
        + "judged only against that criterion's own text and guidance.",
    }),
    el("div", { className: "row" }, [
      field("Rubric version", textInput(c.version, (v) => { c.version = v; markDirty("criteria"); }, { type: "number" }),
        "cases/suites/*.yaml pin this as criteria_version. Bump it when a rule's meaning changes."),
      field("File", el("input", { value: `criteria/${S.phaseId}.yaml`, readOnly: true, className: "mono" })),
    ]),
  ]));

  const list = el("div");
  if (!c.criteria.length) list.append(el("p", { className: "empty", textContent: "No criteria yet." }));

  c.criteria.forEach((item, i) => {
    const head = el("div", { className: "head" }, [el("div", { className: "grip", textContent: `#${i + 1}` })]);
    head.append(...reorderControls(c.criteria, i, () => { markDirty("criteria"); render(); }));
    const del = el("button", { className: "mini", textContent: "Remove" });
    del.onclick = () => { c.criteria.splice(i, 1); markDirty("criteria"); render(); };
    head.append(el("div", { className: "spacer", style: "flex:1" }), del);

    list.append(el("div", { className: "item" }, [
      head,
      el("div", { className: "row" }, [
        field("id", textInput(item.id, (v) => { item.id = v; markDirty("criteria"); }, { mono: true, placeholder: "lower_snake_case" })),
        field("text (the rule, as one sentence)", textInput(item.text, (v) => { item.text = v; markDirty("criteria"); })),
      ]),
      field("gate", selectInput(item.gate || "gating", GATES, (v) => { item.gate = v; markDirty("criteria"); }),
        "gating: a FAIL holds the student in this phase. advisory: judged and reported, "
        + "but never blocks advancement."),
      field("guidance (when to PASS, when to FAIL)",
        textArea(item.guidance, (v) => { item.guidance = v; markDirty("criteria"); }, 5)),
    ]));
  });

  const add = el("button", { className: "act ghost", textContent: "+ Add criterion" });
  add.onclick = () => {
    S.criteria.criteria.push({ id: "", text: "", gate: "gating", guidance: "" });
    markDirty("criteria");
    render();
  };
  out.append(el("div", { className: "card" }, [list, add]));
  return out;
}

async function saveCriteria() {
  if (savedToSandbox("criteria", "Criteria")) return;
  try {
    const d = await api("PUT", `/api/criteria/${S.phaseId}`, S.criteria);
    S.criteria = d.criteria;
    S.dirty.criteria = false;
    // The edit may have just invalidated a stored verdict; refresh so the Rubric
    // tab and the header tally show the staleness immediately.
    await loadRubric();
    say(`Saved criteria/${S.phaseId}.yaml`, "ok");
    render();
  } catch (e) { say(e.message, "err"); }
}

// -------------------------------------------------------------------- problem

function problemPicker(onchange) {
  const s = el("select");
  for (const p of S.boot.problems) {
    const o = el("option", { value: p.slug, textContent: `${p.title} (${p.slug})` });
    if (p.slug === S.problemSlug) o.selected = true;
    s.append(o);
  }
  s.onchange = () => onchange(s.value);
  return s;
}

function renderProblem() {
  const p = S.problem;
  const out = el("div");

  const picker = problemPicker(async (slug) => {
    if (!confirmLeave()) { render(); return; }
    if (anyDirty()) await reloadAll();
    await loadProblem(slug);
    S.result = null;
    render();
  });

  const create = el("button", { className: "act ghost", textContent: "+ New problem" });
  create.onclick = newProblem;
  const remove = el("button", { className: "act ghost danger", textContent: "Delete" });
  remove.onclick = deleteProblem;

  out.append(el("div", { className: "card" }, [
    el("h3", { textContent: "Problem" }),
    el("p", { className: "sub", textContent: "Shared by all three phases. Stored in cases/problems/." }),
    el("div", { className: "row" }, [
      field("Open problem", picker),
      el("div", { className: "row", style: "flex:0 0 auto" }, [create, remove]),
    ]),
  ]));

  out.append(el("div", { className: "card" }, [
    el("div", { className: "row" }, [
      field("id", textInput(p.id, (v) => { p.id = v; markDirty("problem"); }, { mono: true })),
      field("title", textInput(p.title, (v) => { p.title = v; markDirty("problem"); })),
      field("difficulty", textInput(p.difficulty, (v) => { p.difficulty = v; markDirty("problem"); },
        { placeholder: "introductory" })),
      field("topics (comma separated)",
        textInput([].concat(p.topics || []).join(", "), (v) => {
          p.topics = v.split(",").map((t) => t.trim()).filter(Boolean);
          markDirty("problem");
        })),
    ]),
    field("statement", textArea(p.statement, (v) => { p.statement = v; markDirty("problem"); }, 12)),
  ]));

  const cases = el("div");
  const list = p.public_test_cases || (p.public_test_cases = []);
  if (!list.length) cases.append(el("p", { className: "empty", textContent: "No public test cases." }));

  list.forEach((tc, i) => {
    const head = el("div", { className: "head" }, [el("div", { className: "grip", textContent: `#${i + 1}` })]);
    head.append(...reorderControls(list, i, () => { markDirty("problem"); render(); }));
    const del = el("button", { className: "mini", textContent: "Remove" });
    del.onclick = () => { list.splice(i, 1); markDirty("problem"); render(); };
    head.append(el("div", { style: "flex:1" }), del);

    cases.append(el("div", { className: "item" }, [
      head,
      el("div", { className: "row" }, [
        field("input", textArea(tc.input, (v) => { tc.input = v; markDirty("problem"); }, 3, true)),
        field("output", textArea(tc.output, (v) => { tc.output = v; markDirty("problem"); }, 3, true)),
      ]),
    ]));
  });

  const addCase = el("button", { className: "act ghost", textContent: "+ Add test case" });
  addCase.onclick = () => { list.push({ input: "", output: "" }); markDirty("problem"); render(); };

  out.append(el("div", { className: "card" }, [
    el("h3", { textContent: "Public test cases" }),
    el("p", {
      className: "sub",
      textContent: "Given to the student, and shown to the judge as context. The judge is told never to quote them as evidence.",
    }),
    cases, addCase,
  ]));

  return out;
}

async function saveProblem() {
  if (savedToSandbox("problem", "Problem")) return;
  try {
    const d = await api("PUT", `/api/problem/${S.problemSlug}`, S.problem);
    S.problem = d.problem;
    S.boot.problems = d.problems;
    S.dirty.problem = false;
    say(`Saved cases/problems/${S.problemSlug}.yaml`, "ok");
    render();
  } catch (e) { say(e.message, "err"); }
}

async function newProblem() {
  if (S.mode === "sandbox") {
    say("Creating a problem writes a file — leave the sandbox first.", "err");
    return;
  }
  if (!confirmLeave()) return;
  const slug = (prompt("New problem file name (lower_snake_case):") || "").trim();
  if (!slug) return;
  try {
    const d = await api("PUT", `/api/problem/${slug}`, {
      id: `problem.${slug}`,
      title: slug.replace(/_/g, " "),
      difficulty: "introductory",
      topics: [],
      statement: "Describe the task here.\n",
      public_test_cases: [],
    });
    S.boot.problems = d.problems;
    await loadProblem(slug);
    say(`Created cases/problems/${slug}.yaml`, "ok");
    render();
  } catch (e) { say(e.message, "err"); }
}

async function deleteProblem() {
  if (S.mode === "sandbox") {
    say("Deleting a problem writes to disk — leave the sandbox first.", "err");
    return;
  }
  if (!confirm(`Delete cases/problems/${S.problemSlug}.yaml? This cannot be undone.`)) return;
  try {
    const d = await api("DELETE", `/api/problem/${S.problemSlug}`);
    S.boot.problems = d.problems;
    resetDirty();
    await loadProblem(d.problems[0].slug);
    say("Deleted.", "ok");
    render();
  } catch (e) { say(e.message, "err"); }
}
