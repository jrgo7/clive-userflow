id: problem.shopping_total
title: Shopping Total
difficulty: introductory
topics:
- loops
- floating-point
- arithmetic
statement: |
  A till adds up a shopping basket.

  Read an integer n, the number of different items in the basket. Then read n lines, one
  per item. Each line holds two values separated by a space: the price of one unit, a real
  number, and the quantity bought, a whole number.

  Print the total cost of the basket, rounded to two decimal places.

  You may assume there is at least one item, that every price is between 0.01 and 9999.99
  inclusive, and that every quantity is between 1 and 100 inclusive.
public_test_cases:
- input: |-
    3
    10.50 2
    5.25 4
    1.00 10
  output: '52.00'
- input: |-
    1
    99.99 1
  output: '99.99'
- input: |-
    2
    0.10 3
    0.20 4
  output: '1.10'
