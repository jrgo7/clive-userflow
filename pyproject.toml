[project]
name = "clive-userflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Justin Rainier Go", email = "jrgo.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121.0",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
clive-studio = "clive.studio.__main__:main"

[tool.uv.build-backend]
# The distribution is named clive-userflow but the package is src/clive/.
module-name = "clive"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
